{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Mayondo Wood & Furniture System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .playfair {
            font-family: 'Playfair Display', serif;
        }
        
        /* Screen Background - rgba(255, 255, 255, 0.5) */
        body {
            background: rgba(255, 255, 255, 0.5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        
        .glass-container {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border-radius: 24px;
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #1a1a2e;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #c9a84c;
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.15);
        }
        
        .glass-input::placeholder {
            color: rgba(0, 0, 0, 0.35);
        }
        
        .glass-input option {
            color: #1a1a2e;
        }
        
        .glass-button {
            background: linear-gradient(135deg, #c9a84c, #b8943e);
            transition: all 0.3s ease;
            color: white;
        }
        
        .glass-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 168, 76, 0.3);
        }
        
        .glass-divider {
            border-color: rgba(0, 0, 0, 0.08);
        }
        
        .glass-link {
            color: #c9a84c;
            transition: color 0.3s ease;
        }
        
        .glass-link:hover {
            color: #b8943e;
        }
        
        .glass-text {
            color: #1a1a2e;
        }
        
        .glass-text-muted {
            color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="glass-container p-8 w-full max-w-md mx-4">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="flex justify-center mb-4">
                <img src="{% static 'images/Adobelogo.png' %}" alt="Mayondo" class="w-20 h-20 object-contain" />
            </div>
            <h1 class="text-3xl font-bold text-gray-900 playfair">Welcome Back</h1>
            <p class="text-gray-500 mt-2">Sign in to your Mayondo account</p>
        </div>
        
        <!-- Google Sign In Button -->
        <div class="mb-6">
            <a href="{% provider_login_url 'google' method='oauth2' %}" 
               class="w-full flex items-center justify-center gap-3 bg-white/60 hover:bg-white/80 border border-gray-200 text-gray-700 font-medium py-3 px-4 rounded-xl transition duration-300">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-6 h-6">
                Continue with Google
            </a>
        </div>
        
        <!-- Divider -->
        <div class="flex items-center mb-6">
            <hr class="flex-1 glass-divider">
            <span class="px-4 text-sm text-gray-400">OR</span>
            <hr class="flex-1 glass-divider">
        </div>
        
        <!-- Email/Password Login -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
                    <i class="fas fa-user mr-2"></i>Username or Email
                </label>
                <input type="text" name="username" id="username" required
                       class="glass-input w-full px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c9a84c]"
                       placeholder="Enter your username or email">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                    <i class="fas fa-lock mr-2"></i>Password
                </label>
                <input type="password" name="password" id="password" required
                       class="glass-input w-full px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c9a84c]"
                       placeholder="Enter your password">
            </div>
            
            {% if error %}
            <div class="bg-red-500/10 border border-red-500/20 text-red-600 px-4 py-3 rounded-xl text-sm">
                <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
            </div>
            {% endif %}
            
            <button type="submit" class="glass-button w-full font-bold py-3 rounded-xl transition duration-300">
                <i class="fas fa-sign-in-alt mr-2"></i>Sign In
            </button>
        </form>
        
        <div class="text-center mt-6">
            <p class="text-gray-500">
                Don't have an account? 
                <a href="{% url 'register' %}" class="glass-link font-bold">
                    Register here
                </a>
            </p>
        </div>
    </div>
</body>
</html>
