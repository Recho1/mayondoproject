{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Mayondo Wood & Furniture System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        .playfair { font-family: 'Playfair Display', serif; }
        
        body {
            background: rgba(110, 106, 106, 0.5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .glass-container {
            background: rgba(151, 149, 149, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border-radius: 24px;
            padding: 32px;
            max-width: 420px;
            width: 100%;
        }
        
        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #1a1a2e;
            transition: all 0.3s ease;
            padding: 10px 14px;
            font-size: 14px;
            width: 100%;
            border-radius: 12px;
            outline: none;
        }
        
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: #c9a84c;
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.15);
        }
        
        .glass-input::placeholder {
            color: rgba(0, 0, 0, 0.35);
        }
        
        .glass-button {
            background: linear-gradient(135deg, #c9a84c, #b8943e);
            transition: all 0.3s ease;
            color: white;
            padding: 10px;
            font-size: 14px;
            border: none;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
        }
        
        .glass-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 168, 76, 0.3);
        }
        
        .glass-link {
            color: #edebe7;
            transition: color 0.3s ease;
            text-decoration: none;
            font-weight: 600;
        }
        
        .glass-link:hover {
            color: #b8943e;
        }
        
        .glass-divider {
            border-color: rgba(0, 0, 0, 0.08);
        }
        
        label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            display: block;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="flex justify-center mb-3">
                <img src="{% static 'images/Adobelogo.png' %}" alt="Mayondo" class="w-16 h-16 object-contain" />
            </div>
            <h1 class="text-2xl font-bold text-gray-900 playfair">Welcome Back</h1>
            <p class="text-gray-500 text-sm mt-1">Sign in to your Mayondo account</p>
        </div>
        
        <!-- Google Sign In Button -->
        <div class="mb-4">
            <a href="{% provider_login_url 'google' method='oauth2' %}" 
               class="w-full flex items-center justify-center gap-3 bg-white/60 hover:bg-white/80 border border-gray-200 text-gray-700 font-medium py-2.5 px-4 rounded-xl transition duration-300 text-sm">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5">
                Continue with Google
            </a>
        </div>
        
        <!-- Divider -->
        <div class="flex items-center mb-4">
            <hr class="flex-1 glass-divider">
            <span class="px-3 text-xs text-gray-400">OR</span>
            <hr class="flex-1 glass-divider">
        </div>
        
        <!-- Email/Password Login -->
        <form method="POST" class="space-y-3">
            {% csrf_token %}
            
            <div>
                <label for="username">Username or Email</label>
                <input type="text" name="username" id="username" required
                       class="glass-input" placeholder="Enter your username or email">
            </div>
            
            <div>
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required
                       class="glass-input" placeholder="Enter your password">
            </div>
            
            {% if error %}
            <div class="bg-red-500/10 border border-red-500/20 text-red-600 px-3 py-2 rounded-xl text-sm">
                <i class="fas fa-exclamation-circle mr-1"></i>{{ error }}
            </div>
            {% endif %}
            
            <button type="submit" class="glass-button">
                <i class="fas fa-sign-in-alt mr-2"></i>Sign In
            </button>
        </form>
        
        <div class="text-center mt-4">
            <p class="text-gray-500 text-sm">
                Don't have an account? 
                <a href="{% url 'register' %}" class="glass-link">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
