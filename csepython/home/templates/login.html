<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Login</title>
  <style>
    /* Make checkbox hover/checked black */
    input[type="checkbox"] {
      accent-color: black;
    }

    input[type="checkbox"]:hover {
      filter: brightness(0.8);
    }

    /* Input fields match form background and remove all focus effect */
    input[type="text"],
    input[type="password"] {
      background-color: #ffffff; /* same as form */
      border: 1px solid #ccc;
      outline: none;
      box-shadow: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      box-shadow: none;
    }
  </style>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

  <div class="flex-grow flex justify-center items-center">
    <form action="/login/" method="post" class="bg-white shadow-2xl rounded-2xl p-10 w-full max-w-md text-center">
      {% csrf_token %}
      <h3 class="text-2xl font-semibold mb-6" style="color: black;">Sign In</h3>

      <!-- username -->
      <div class="mb-5 text-left">
        <label for="username" class="block text-gray-700 font-medium mb-2">Username</label>
        <input type="text" id="username" name="username" class="w-full rounded-lg px-3 py-2" required />
      </div>

      <!-- password -->
      <div class="mb-5 text-left">
        <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
        <input type="password" id="password" name="password" class="w-full rounded-lg px-3 py-2" />
      </div>

      <!-- show password -->
      <div class="flex items-center justify-start mb-6">
        <label for="show-password" class="flex items-center gap-2 text-gray-700 cursor-pointer">
          <input type="checkbox" id="show-password" class="w-4 h-4">
          Show Password
        </label>
      </div>

      <!-- submit button -->
      <button type="submit"
        class="w-full bg-black text-yellow-400 py-2 rounded-full hover:bg-gray-800 transition duration-300 font-semibold">
        Login
      </button>

      <!-- error message -->
      {% if error %}
      <p class="text-red-500 text-sm mt-3">{{ error }}</p>
      {% endif %}
    </form>
  </div>

  <!-- footer -->
  <footer class="bg-black text-center py-4 mt-auto" style="color: gold;">
    <p>© 2025 Mayondo Wood and Furniture. All Rights Reserved. Designed by Racheal Acio.</p>
  </footer>

  <!--show password -->
  <script>
    const showPassword = document.getElementById("show-password");
    const passwordField = document.getElementById("password");

    showPassword.addEventListener("change", function () {
      passwordField.type = this.checked ? "text" : "password";
    });
  </script>

</body>
</html>
