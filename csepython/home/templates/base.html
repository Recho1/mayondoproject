{% load static %}

<html>

    <title>{% block title %}Mayondo Project{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

        <!-- Sidebar -->
        {% include 'sidebar.html' %}
        
        <!-- Main Content -->
        <div class="flex-1 p-8 bg-gray-100 min-h-screen">

    </div>

</html>
