{% extends "base_auth.html" %}
{% load static %}

{% block content %}
<div class="bg-white rounded-lg shadow-lg p-6 max-w-2xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-shopping-cart text-green-500 mr-2"></i>Record New Sale
        </h1>
        <a href="{% url 'sales' %}" class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-arrow-left"></i> Back to Sales
        </a>
    </div>
    
    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-4">
        <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
    </div>
    {% endif %}
    
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="customername">
                    <i class="fas fa-user mr-1"></i> Customer Name *
                </label>
                <input type="text" name="customername" id="customername" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c9a84c]"
                       placeholder="Enter customer name">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="productname">
                    <i class="fas fa-box mr-1"></i> Product *
                </label>
                <select name="productname" id="productname" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c9a84c]">
                    <option value="">Select a product...</option>
                    {% for stock in stocks %}
                    <option value="{{ stock.id }}">
                        {{ stock.productname }} ({{ stock.quantity }} available - ${{ stock.costprice_unitcost }})
                    </option>
                    {% empty %}
                    <option value="">No products available</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="quantity">
                    <i class="fas fa-hashtag mr-1"></i> Quantity *
                </label>
                <input type="number" name="quantity" id="quantity" required min="1"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c9a84c]"
                       placeholder="Enter quantity">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="sellingprice">
                    <i class="fas fa-dollar-sign mr-1"></i> Selling Price per Unit *
                </label>
                <input type="number" step="0.01" name="sellingprice" id="sellingprice" required min="0.01"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c9a84c]"
                       placeholder="0.00">
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="transportfare">
                    <i class="fas fa-truck mr-1"></i> Transport Fare
                </label>
                <input type="number" step="0.01" name="transportfare" id="transportfare" value="0" min="0"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c9a84c]"
                       placeholder="0.00">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="paymentmethod">
                    <i class="fas fa-credit-card mr-1"></i> Payment Method *
                </label>
                <select name="paymentmethod" id="paymentmethod" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c9a84c]">
                    <option value="cash">Cash</option>
                    <option value="mobile">Mobile Money</option>
                    <option value="bank">Bank Transfer</option>
                    <option value="credit">Credit</option>
                </select>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="date">
                    <i class="fas fa-calendar mr-1"></i> Sale Date *
                </label>
                <input type="date" name="date" id="date" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#c9a84c]">
            </div>
            
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2" for="is_paid">
                    <i class="fas fa-check-circle mr-1"></i> Payment Status
                </label>
                <div class="flex items-center space-x-4 pt-2">
                    <label class="flex items-center">
                        <input type="radio" name="is_paid" value="on" checked class="mr-2">
                        <span class="text-green-600">Paid</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="is_paid" value="off" class="mr-2">
                        <span class="text-red-600">Unpaid</span>
                    </label>
                </div>
            </div>
        </div>
        
        <div class="flex items-center justify-end space-x-4 pt-4 border-t border-gray-200">
            <a href="{% url 'sales' %}" class="px-6 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-lg transition">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2 bg-green-500 hover:bg-green-700 text-white font-bold rounded-lg transition">
                <i class="fas fa-save mr-2"></i> Record Sale
            </button>
        </div>
    </form>
    
    <div class="mt-6 p-4 bg-[#faf7f0] rounded-lg text-sm text-gray-600">
        <i class="fas fa-info-circle text-[#c9a84c] mr-2"></i>
        After recording a sale, stock quantity will be automatically updated.
        <a href="{% url 'allsales' %}" class="text-[#c9a84c] hover:text-[#b8943e]">View all sales</a>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('date').value = new Date().toISOString().split('T')[0];
    
    // Calculate total when quantity or price changes
    document.getElementById('quantity').addEventListener('change', calculateTotal);
    document.getElementById('sellingprice').addEventListener('change', calculateTotal);
    
    function calculateTotal() {
        const quantity = parseFloat(document.getElementById('quantity').value) || 0;
        const price = parseFloat(document.getElementById('sellingprice').value) || 0;
        // You can display total somewhere if you want
    }
</script>
{% endblock %}
