{% extends "base.html" %}

{% load static %}

{% block content %}
<div class="text-center">
    <h1 class="text-4xl font-bold text-gray-900 mb-4">Welcome to Mayondo Project</h1>
    <p class="text-xl text-gray-600 mb-8">Your Inventory Management System</p>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto">
        <div class="bg-blue-100 p-6 rounded-lg shadow">
            <h3 class="text-lg font-semibold text-blue-800">Total Stock</h3>
            <p class="text-3xl font-bold text-blue-600">{{ total_stock|default:"0" }}</p>
        </div>
        <div class="bg-green-100 p-6 rounded-lg shadow">
            <h3 class="text-lg font-semibold text-green-800">Total Sales</h3>
            <p class="text-3xl font-bold text-green-600">{{ total_sales|default:"0" }}</p>
        </div>
        <div class="bg-purple-100 p-6 rounded-lg shadow">
            <h3 class="text-lg font-semibold text-purple-800">Total Users</h3>
            <p class="text-3xl font-bold text-purple-600">{{ total_users|default:"0" }}</p>
        </div>
    </div>

    <div class="mt-8 space-x-4">
        <a href="{% url 'login' %}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            Login
        </a>
        <a href="{% url 'register' %}" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
            Register
        </a>
    </div>
</div>
{% endblock %}
