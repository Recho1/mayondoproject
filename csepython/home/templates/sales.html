{% extends "base_auth.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-4">Sales Management</h1>
    <p class="text-xl text-gray-600 mb-8">Manage your sales here</p>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto">
        <a href="{% url 'add_sales' %}" class="bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded text-center">
            ➕ Record New Sale
        </a>
        <a href="{% url 'allsales' %}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded text-center">
            📋 View All Sales
        </a>
        <a href="{% url 'dashboard' %}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-3 px-6 rounded text-center">
            ← Back to Dashboard
        </a>
