{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- YOUR EXISTING CSS - Keep exactly as you had it -->
    <style>
        /* Your original styles */
        body {
            font-family: 'Inter', sans-serif;
        }
        .sidebar-link {
            transition: all 0.2s;
        }
        .sidebar-link:hover {
            background-color: #374151;
        }
        .sidebar-link.active {
            background-color: #D97706;
        }
    </style>
</head>
<body>
    <div class="flex h-screen bg-gray-100">
        <!-- SIDEBAR NAVIGATION -->
        <div class="w-64 bg-gray-800 text-white p-4 flex flex-col">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-yellow-400">Mayondo</h2>
                <p class="text-sm text-gray-400 mt-1">Inventory Management</p>
            </div>
            
            <nav class="flex-1">
                <a href="/" class="sidebar-link flex items-center space-x-2 p-3 rounded-lg hover:bg-gray-700 transition duration-200 mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span>Dashboard</span>
                </a>
                
                <a href="/stock/" class="sidebar-link flex items-center space-x-2 p-3 rounded-lg hover:bg-gray-700 transition duration-200 mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                    </svg>
                    <span>Add Stock</span>
                </a>
                
                <a href="/allstock/" class="sidebar-link flex items-center space-x-2 p-3 rounded-lg hover:bg-gray-700 transition duration-200 mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path>
                    </svg>
                    <span>All Stock</span>
                </a>
                
                <a href="/sales/" class="sidebar-link flex items-center space-x-2 p-3 rounded-lg bg-yellow-600 hover:bg-yellow-700 transition duration-200 mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>Add Sales</span>
                </a>
                
                <a href="/allsales/" class="sidebar-link flex items-center space-x-2 p-3 rounded-lg hover:bg-gray-700 transition duration-200 mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path>
                    </svg>
                    <span>All Sales</span>
                </a>
                
                <a href="/allusers/" class="sidebar-link flex items-center space-x-2 p-3 rounded-lg hover:bg-gray-700 transition duration-200 mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <span>All Users</span>
                </a>
                
                <hr class="border-gray-700 my-4">
                
                <a href="/logout/" class="sidebar-link flex items-center space-x-2 p-3 rounded-lg hover:bg-red-600 transition duration-200 text-red-400 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    <span>Logout</span>
                </a>
            </nav>
        </div>

        <!-- MAIN CONTENT - YOUR ORIGINAL DESIGN -->
        <div class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-4xl mx-auto">
                <div class="bg-white rounded-lg shadow-lg p-6">
                    <h1 class="text-3xl font-bold text-gray-800 mb-6">Add New Sale</h1>
                    
                    <!-- YOUR ORIGINAL FORM -->
                    <form method="POST" action="/sales/" class="space-y-4">
                        {% csrf_token %}
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Customer Name</label>
                                <input type="text" name="customername" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Product Type</label>
                                <input type="text" name="producttype" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Product Name</label>
                                <select name="productname" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                                    <option value="">Select Product</option>
                                    {% for stock in stocks %}
                                    <option value="{{ stock.id }}">{{ stock.productname }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Quantity</label>
                                <input type="number" name="quantity" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Selling Price</label>
                                <input type="number" step="0.01" name="sellingprice" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Transport Fare</label>
                                <input type="number" step="0.01" name="transportfare" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Payment Method</label>
                                <select name="paymentmethod" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                                    <option value="Cash">Cash</option>
                                    <option value="Mobile Money">Mobile Money</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                    <option value="Credit">Credit</option>
                                </select>
                            </div>
                            
                            <div>
                                <label class="block text-gray-700 font-medium mb-2">Sales Agent</label>
                                <select name="salesagentname" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
                                    <option value="">Select Agent</option>
                                    {% for agent in agents %}
                                    <option value="{{ agent.id }}">{{ agent.username }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="mt-6 flex space-x-4">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                                Save Sale
                            </button>
                            <a href="/allsales/" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-lg transition duration-200">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
