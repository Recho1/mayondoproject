{% load static %}
<!-- FLOATING CHAT WIDGET - ALWAYS VISIBLE -->
<div style="position: fixed; bottom: 30px; right: 30px; z-index: 99999;">
    <button onclick="toggleChatWidget()" style="
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c9a84c, #b8943e);
        border: none;
        color: white;
        font-size: 30px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(201, 168, 76, 0.5);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    " onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">
        🤖
    </button>
    
    <!-- Chat Window -->
    <div id="chatWindow" style="
        display: none;
        position: fixed;
        bottom: 110px;
        right: 30px;
        width: 380px;
        height: 500px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        z-index: 99998;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(201,168,76,0.2);
    ">
        <!-- Header -->
        <div style="
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #c9a84c;
        ">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 20px;">🤖</span>
                <span style="font-weight: 600;">Mayondo AI</span>
            </div>
            <button onclick="toggleChatWidget()" style="
                background: none;
                border: none;
                color: white;
                font-size: 22px;
                cursor: pointer;
                opacity: 0.7;
            ">✕</button>
        </div>
        
        <!-- Messages -->
        <div id="chatMessages" style="
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f8f8f8;
        ">
            <div style="
                background: white;
                padding: 12px 16px;
                border-radius: 12px;
                margin-bottom: 12px;
                max-width: 85%;
                border: 1px solid #e5e7eb;
                font-size: 14px;
            ">
                <div style="font-size: 12px; color: #c9a84c; margin-bottom: 4px;">🤖 Mayondo AI</div>
                Hello! I'm your business assistant. How can I help you?
            </div>
        </div>
        
        <!-- Suggestions -->
        <div style="
            padding: 8px 15px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background: white;
            border-top: 1px solid #f3f4f6;
        ">
            <button onclick="sendQuickMsg('What are today\'s sales?')" style="
                background: #f3f4f6;
                border: none;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 11px;
                color: #4b5563;
                cursor: pointer;
            ">📊 Today's Sales</button>
            <button onclick="sendQuickMsg('Which products are low in stock?')" style="
                background: #f3f4f6;
                border: none;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 11px;
                color: #4b5563;
                cursor: pointer;
            ">📦 Low Stock</button>
            <button onclick="sendQuickMsg('Give me a business summary')" style="
                background: #f3f4f6;
                border: none;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 11px;
                color: #4b5563;
                cursor: pointer;
            ">📈 Summary</button>
        </div>
        
        <!-- Input -->
        <div style="
            padding: 12px 15px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            background: white;
        ">
            <input type="text" id="chatInput" placeholder="Ask me anything..." style="
                flex: 1;
                padding: 10px 14px;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                outline: none;
                font-size: 14px;
            " onkeypress="if(event.key==='Enter') sendChatMsg()">
            <button onclick="sendChatMsg()" style="
                padding: 10px 18px;
                background: linear-gradient(135deg, #c9a84c, #b8943e);
                color: white;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                font-weight: 600;
            ">Send</button>
        </div>
    </div>
</div>

<script>
    let conversationId = null;
    let isProcessing = false;
    
    function toggleChatWidget() {
        const window = document.getElementById('chatWindow');
        if (window.style.display === 'flex') {
            window.style.display = 'none';
        } else {
            window.style.display = 'flex';
            document.getElementById('chatInput').focus();
        }
    }
    
    function addChatMessage(role, content) {
        const container = document.getElementById('chatMessages');
        const div = document.createElement('div');
        
        if (role === 'user') {
            div.style.cssText = `
                background: linear-gradient(135deg, #c9a84c, #b8943e);
                color: white;
                padding: 10px 14px;
                border-radius: 12px;
                margin-bottom: 12px;
                max-width: 85%;
                margin-left: auto;
                font-size: 14px;
                border-bottom-right-radius: 4px;
            `;
            div.textContent = content;
        } else {
            div.style.cssText = `
                background: white;
                padding: 10px 14px;
                border-radius: 12px;
                margin-bottom: 12px;
                max-width: 85%;
                border: 1px solid #e5e7eb;
                font-size: 14px;
                border-bottom-left-radius: 4px;
            `;
            div.innerHTML = `<div style="font-size: 12px; color: #c9a84c; margin-bottom: 4px;">🤖 Mayondo AI</div>${content}`;
        }
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
    
    function sendQuickMsg(text) {
        document.getElementById('chatInput').value = text;
        sendChatMsg();
    }
    
    function sendChatMsg() {
        if (isProcessing) return;
        
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if (!message) return;
        
        input.value = '';
        addChatMessage('user', message);
        isProcessing = true;
        
        // Show thinking
        const container = document.getElementById('chatMessages');
        const thinkingDiv = document.createElement('div');
        thinkingDiv.id = 'thinkingMsg';
        thinkingDiv.style.cssText = `
            background: white;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            max-width: 85%;
            border: 1px solid #e5e7eb;
            font-size: 14px;
            border-bottom-left-radius: 4px;
        `;
        thinkingDiv.innerHTML = `<div style="font-size: 12px; color: #c9a84c; margin-bottom: 4px;">🤖 Mayondo AI</div>🤔 Thinking...`;
        container.appendChild(thinkingDiv);
        container.scrollTop = container.scrollHeight;
        
        fetch('/ai-assistant/api/chat/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({
                message: message,
                conversation_id: conversationId
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('thinkingMsg').remove();
            if (data.response) {
                addChatMessage('assistant', data.response);
                if (data.conversation_id) {
                    conversationId = data.conversation_id;
                }
            } else {
                addChatMessage('assistant', '❌ Sorry, I encountered an error. Please try again.');
            }
            isProcessing = false;
        })
        .catch(error => {
            const thinking = document.getElementById('thinkingMsg');
            if (thinking) thinking.remove();
            addChatMessage('assistant', '❌ Sorry, I encountered an error. Please try again.');
            isProcessing = false;
        });
    }
    
    function getCsrfToken() {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, 10) === 'csrftoken=') {
                    cookieValue = decodeURIComponent(cookie.substring(10));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
