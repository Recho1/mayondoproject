{% extends "base_auth.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-[#1a1a2e] mb-4">Stock Management</h1>
    <p class="text-xl text-gray-600 mb-8">Manage your inventory here</p>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto">
        <a href="{% url 'add_stock' %}" class="bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded text-center">
            ➕ Add New Stock
        </a>
        <a href="{% url 'allstock' %}" class="bg-[#c9a84c] hover:bg-[#b8943e] text-white font-bold py-3 px-6 rounded text-center">
            📋 View All Stock
        </a>
        <a href="{% url 'dashboard' %}" class="bg-gray-500 hover:bg-[#2d2d4a] text-white font-bold py-3 px-6 rounded text-center">
            ← Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
