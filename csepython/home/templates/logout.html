{% extends "base.html" %}
{% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - Mayondo Project</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center">
            <!-- Logout Icon -->
            <div class="mb-6">
                <svg class="w-20 h-20 mx-auto text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <h2 class="text-3xl font-bold text-gray-800 mb-2">Logged Out Successfully</h2>
            <p class="text-gray-600 mb-6">You have been logged out of your account.</p>

            <div class="space-y-3">
                <a href="/login/" 
                   class="block w-full bg-blue-600 hover:bg-[#b8943e] text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                    Login Again
                </a>
                <a href="/" 
                   class="block w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-lg transition duration-200">
                    Return to Home
                </a>
            </div>

            <!-- Redirect timer -->
            <p class="text-sm text-gray-500 mt-6">
                You will be redirected to the login page in <span id="countdown" class="font-bold">5</span> seconds.
            </p>
        </div>
    </div>

    <!-- Auto-redirect script -->
    <script>
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');

        const timer = setInterval(() => {
            seconds--;
            if (seconds >= 0) {
                countdownElement.textContent = seconds;
            }
            if (seconds === 0) {
                clearInterval(timer);
                window.location.href = '/login/';
            }
        }, 1000);
    </script>
